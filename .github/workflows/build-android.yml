name: 灵境胜杯 Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build web app
      run: npm run build
    
    - name: Sync web resources to Android
      run: npx cap sync android
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Android SDK 36
      run: |
        SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)
        fi
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager not found"
          exit 1
        fi
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
    
    - name: Make gradlew executable
      run: chmod +x ./android/gradlew

    - name: Create keystore file from GitHub Secrets
      run: |
        cd android
        if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "Error: KEYSTORE_BASE64 secret is not set"
          exit 1
        fi
        if [ -f "my-release-key.keystore" ]; then
          rm -f my-release-key.keystore
        fi
        echo "Creating keystore file from GitHub Secrets"
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-release-key.keystore
        echo "=== Listing aliases in keystore ==="
        keytool -list -keystore my-release-key.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}"
        echo "=== Keystore file details ==="
        ls -la my-release-key.keystore
        file my-release-key.keystore

    - name: Extract SHA1 from keystore
      run: |
        cd android
        echo "Run # 将 base64 编码的 keystore 还原为文件"
        echo "# 将 base64 编码的 keystore 还原为文件"
        echo ""
        full_output=$(keytool -list -v -keystore my-release-key.keystore -alias lingjingshengbei -storepass "${{ secrets.KEYSTORE_PASSWORD }}")
        
        sha1_with_colons=$(echo "$full_output" | grep -i "sha1:" | head -1 | sed 's/.*sha1:\s*//i' | sed 's/\s*$//')
        sha256_with_colons=$(echo "$full_output" | grep -i "sha256:" | head -1 | sed 's/.*sha256:\s*//i' | sed 's/\s*$//')
        md5_with_colons=$(echo "$full_output" | grep -i "md5:" | head -1 | sed 's/.*md5:\s*//i' | sed 's/\s*$//')
        
        echo "===== 证书指纹 ====="
        echo "     SHA1: $sha1_with_colons"
        echo "     SHA256: $sha256_with_colons"
        echo "===================="
        echo ""
        echo "===== MD5 指纹 ====="
        echo "$md5_with_colons"
        echo "===================="
        echo ""
        echo "===== SHA1 指纹（小米应用商店用）====="
        echo "$sha1_with_colons"
        echo "======================================="
        echo ""
        echo "===== 去掉冒号的 SHA1（直接复制）====="
        sha1_without_colons=$(echo "$sha1_with_colons" | tr -d ":")
        echo "$sha1_without_colons"
        echo "======================================="
        echo ""
        echo "===== 公钥信息 ====="
        echo "Certificate fingerprints:"
        echo "     SHA1: $sha1_with_colons"
        echo "     SHA256: $sha256_with_colons"
        signature_algorithm=$(echo "$full_output" | grep -i "Signature algorithm name" | head -1 | sed 's/.*://' | sed 's/\s*$//')
        echo "Signature algorithm name: $signature_algorithm"
        echo "============================="

    - name: Build Android Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        cd android
        echo "=== Building Release APK ==="
        ./gradlew clean
        ./gradlew assembleRelease --no-build-cache --no-daemon
        ls -la app/build/outputs/apk/release/

    - name: Build Android Debug APK
      run: |
        cd android
        ./gradlew assembleDebug
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: 灵境胜杯-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 30
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: 灵境胜杯-release-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
        retention-days: 30
