<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>灵境胜杯</title>
    <meta name="description" content="潮汕筊杯（圣杯）民俗文化模拟工具，纯本地离线存储，仅供民俗文化娱乐参考。" />
    <meta property="og:title" content="灵境胜杯" />
    <meta property="og:description" content="潮汕筊杯（圣杯）民俗文化模拟工具，纯本地离线存储，仅供民俗文化娱乐参考。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#8B3A2B" />
    <script>
      (function () {
        try {
          var raw =
            localStorage.getItem('com.ljsb.app.settings') ||
            localStorage.getItem('lingjing_shengbei_settings');
          if (raw) {
            var saved = JSON.parse(raw);
            if (saved && saved.theme === 'dark') {
              document.documentElement.classList.add('dark');
              var meta = document.querySelector('meta[name="theme-color"]');
              if (meta) meta.setAttribute('content', '#161210');
            }
          }
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="灵境胜杯" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
